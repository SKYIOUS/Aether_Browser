[workspace]
members = ["korlang", "crates/aether-dom", "crates/aether-css", "crates/layout-engine", "crates/aether-js"]
resolver = "2"
[package]
name = "vayu-browser"
version = "0.1.0"
edition = "2021"
[lib]
path = "src/lib.rs"
[dependencies]
iced = { version = "0.13", features = ["canvas", "image", "tiny-skia", "wgpu", "tokio"] }
tokio = { version = "1", features = ["rt", "macros"] }
rquickjs = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "rustls-tls", "gzip", "brotli"] }
image = "0.25"
korlang = { path = "./korlang" }
strum = { version = "0.26", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

aether-dom = { path = "crates/aether-dom" }
aether-css = { path = "crates/aether-css" }
layout-engine = { path = "crates/layout-engine", features = ["taffy-backend", "native-backend"] }
# rquickjs 0.12 reviewed: no breaking changes in Context creation,
# function callbacks (Fn->Result pattern preserved), or Promise handling.
# Upgrade from 0.11 to 0.12 is a minor version bump with compatible API surface.
html5ever = { version = "0.39.0", default-features = false }
tendril = "0.5.1"
taffy = "0.12.0"
cosmic-text = "0.12"
resvg = "0.48"
lru = "0.13"
cssparser = "0.37"
selectors = "0.40"
precomputed-hash = "0.1"

[profile.dev]
overflow-checks = false

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[[bench]]
name = "pipeline"
harness = false

[features]
default = ["content_size", "layout-native"]
content_size = []
layout-taffy = ["layout-engine/taffy-backend"]
layout-native = ["layout-engine/native-backend"]
